# Reference example (neutral, schema v2) of an adopter reconciliation review.
# Committed by the adopter as `.aicore/adoption-review.yaml` alongside the
# declaration. `propose-lock` binds its raw digest into the lock as
# `review_digest`, so a changed review invalidates the lock.
#
# A decision is required for every non-mirror unit (`adapted`, `replacement`,
# `destination_owned`) whose upstream digest changed between the accepted
# baseline and the target revision. `mirror` and `not_applicable` units need
# no decision.
schema_version: 2
upstream_repository: JPerezC92/ai-core
decisions:
  - unit: root-runtime-spec
    decision: applied
    evidence: "Merged the new reuse-guide paragraph into BASE-RULES.md; local sections retained."
    reviewer: lead-orchestrator

  - unit: bastion
    decision: applied
    evidence: "Adopted the new script-architecture rule; local stack notes kept."
    reviewer: backend-architect

  - unit: investigator
    decision: superseded
    evidence: "Generic investigator is replaced by role-a/role-b; no upstream merge applies."
    reviewer: hr-director
