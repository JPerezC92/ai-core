# AICore core catalog (schema v1)
#
# Single authoritative machine inventory for BOTH initial adoption
# (migrate-core-to-project) and recurring synchronization
# (sync-aicore-adoption). Do not hand-edit adopter copies; edit here.
#
# Ownership split:
#   - This catalog is UPSTREAM-OWNED: unit identity, logical members,
#     real tracked source paths, default canonical destinations, eligibility,
#     and install strategy.
#   - Adopter-owned intent (mode, destination overrides, replacement mapping)
#     lives ONLY in the adopter declaration (`.aicore/adoption.yaml`).
#   - The AICore management tools (`migrate-core-to-project` and
#     `sync-aicore-adoption`) are UPSTREAM-ONLY operator tools, invoked from an
#     AICore checkout against runtime-supplied adopter paths. They are never
#     adopted-content units, and neither the migration tool nor this catalog is
#     a unit below.
#
# sync_projection:
#   file  - single tracked file projected for content synchronization
#   tree  - directory of tracked files projected for content synchronization
#   none  - installer-only; generated/merged fragment with no deterministic
#           byte projection. Never appears in an adoption declaration or lock.
schema_version: 1

catalog:
  version: 1.0.0
  upstream_repository: JPerezC92/ai-core
  digest_algorithm: sha256
  digest_exclusions:
    - "**/__pycache__/**"
    - "**/*.pyc"
  control_paths:
    - ".git/**"
    - ".aicore/adoption.yaml"
    - ".aicore/adoption.lock.yaml"

# kind: skill | agent | infra | config
# install_strategy: copy | merge | preserve
#   copy     - write members as-is (installer); present items are never touched
#   merge    - merge roster/permission/ignore fragments into an existing file
#   preserve - installer-only marker for a directory that must exist
# include_rule text is the human eligibility clause; it is evaluated by the
# installer using mechanical checks (stack markers, ticket marker, python
# script presence) and is never overridden by adopter hints.
units:
  # ---------------------------------------------------------------- skills
  - id: git-branch-name
    kind: skill
    include_rule: always
    install_strategy: copy
    sync_projection: tree
    members:
      - id: tree
        source: .opencode/skills/git-branch-name
        destination: .opencode/skills/git-branch-name

  - id: git-commit
    kind: skill
    include_rule: always
    install_strategy: copy
    sync_projection: tree
    members:
