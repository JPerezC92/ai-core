  # ---------------------------------------------------------------- config
  - id: root-runtime-spec
    kind: config
    include_rule: always
    install_strategy: merge
    sync_projection: file
    members:
      - { id: root, source: AGENTS.md, destination: AGENTS.md }
    notes: >-
      Installer merges new roster lines into an existing root file; an adopter
      may map the logical `root` member to a differently named runtime spec
      (e.g. CLAUDE.md) via its declaration.

  - id: opencode-config
    kind: config
    include_rule: always
    install_strategy: merge
    sync_projection: none
    members:
      - { id: permissions, source: "(permission block)", destination: opencode.jsonc }
    notes: >-
      Installer-only. Appends missing permission gates by matching an existing
      gate; never duplicated. Excluded from adoption declarations and locks
      until a deterministic extractor exists.

  - id: gitignore-config
    kind: config
    include_rule: always
    install_strategy: merge
    sync_projection: none
    members:
      - { id: entries, source: "(entries)", destination: .gitignore }
    notes: >-
      Installer-only. Appends-if-missing entries; `sync_projection: none`
      because `.gitignore` is an adopter-owned merge fragment, not copied
      content. Excluded from adoption declarations and locks.
