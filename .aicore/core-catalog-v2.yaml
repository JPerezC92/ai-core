  - id: query-verification
    kind: skill
    applicability: { requires: [ticket_system] }
    install_strategy: copy
    sync_projection: tree
    members:
      - { id: tree, source: .opencode/skills/query-verification, destination: .opencode/skills/query-verification }

  - id: ticket-runbook
    kind: skill
