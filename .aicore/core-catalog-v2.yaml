# AICore core catalog (schema v2)
#
# Single authoritative machine inventory for BOTH initial adoption
# (migrate-core-to-project) and recurring synchronization
# (sync-aicore-adoption). This file is the upstream source of truth: edit it
# in AICore, and the management tools consume it read-only at one explicit
# AICore revision.
#
# v2 is an ATOMIC contract: an adopter accepts exactly one upstream revision
# and must account for every catalog unit. Partial per-unit acceptance is
# forbidden. A unit is either adopted (with a real mode) or explicitly
# `not_applicable`, and `not_applicable` is valid only when the unit's
# applicability conditions are false under the adopter's declared profile.
#
# sync_projection:
#   file       - single tracked file projected for content synchronization
#   tree       - directory of tracked files projected for content synchronization
#   assertions - deterministic required-substring assertions over a merged
#                adopter-owned fragment (comment lines are ignored before
#                matching). There is no `none`: every unit is checkable.
schema_version: 2

catalog:
  version: 2.0.0
  upstream_repository: JPerezC92/ai-core
  digest_algorithm: sha256
  digest_exclusions:
    - "**/__pycache__/**"
    - "**/*.pyc"
  control_paths:
    - ".git/**"
    - ".aicore/adoption.yaml"
    - ".aicore/adoption.lock.yaml"
    - ".aicore/adoption-review.yaml"

# applicability conditions are evaluated against the adopter declaration's
# `profile` block. `always: true` units may never be `not_applicable`.
# Marker vocabulary: backend_stack, python_scripts, ticket_system.
units:
  # ---------------------------------------------------------------- skills
  - id: git-branch-name
    kind: skill
    applicability: { always: true }
    install_strategy: copy
    sync_projection: tree
    members:
      - { id: tree, source: .opencode/skills/git-branch-name, destination: .opencode/skills/git-branch-name }

  - id: git-commit
    kind: skill
    applicability: { always: true }
    install_strategy: copy
    sync_projection: tree
    members:
