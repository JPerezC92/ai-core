  # ----------------------------------------------------------------- infra
  - id: knowledge-agents
    kind: infra
    applicability: { always: true }
    install_strategy: copy
    sync_projection: file
    members:
      - { id: file, source: knowledge/agents.md, destination: knowledge/agents.md }

  - id: knowledge-debt
    kind: infra
    applicability: { always: true }
    install_strategy: copy
    sync_projection: file
    members:
      - { id: file, source: knowledge/debt.md, destination: knowledge/debt.md }

  - id: symptom-problem-register
    kind: infra
    applicability: { always: true }
    install_strategy: copy
    sync_projection: file
    members:
      - { id: symptoms, source: knowledge/symptoms.md, destination: knowledge/symptoms.md }
      - { id: problems, source: knowledge/problems.md, destination: knowledge/problems.md }

  - id: query-verification-design
    kind: infra
    applicability: { requires: [ticket_system] }
    install_strategy: copy
    sync_projection: file
    members:
      - { id: file, source: knowledge/query-verification-design.md, destination: knowledge/query-verification-design.md }

  - id: plans
    kind: infra
    applicability: { always: true }
    install_strategy: preserve
    sync_projection: file
    members:
      - { id: gitkeep, source: plans/.gitkeep, destination: plans/.gitkeep }

  - id: user-stories
    kind: infra
    applicability: { always: true }
    install_strategy: preserve
    sync_projection: file
    members:
      - { id: gitkeep, source: user-stories/.gitkeep, destination: user-stories/.gitkeep }

  # ---------------------------------------------------------------- config
  - id: root-runtime-spec
    kind: config
    applicability: { always: true }
    install_strategy: merge
    sync_projection: file
    members:
      - { id: root, source: AGENTS.md, destination: AGENTS.md }
    notes: >-
      Installer merges new roster lines into an existing root file; an adopter
      may map the logical `root` member to a differently named runtime spec
      (e.g. CLAUDE.md) via its declaration.

  - id: opencode-config
    kind: config
    applicability: { always: true }
    install_strategy: merge
    sync_projection: assertions
    destination: opencode.jsonc
    assertions:
      - { id: gh-pr-merge-deny, contains: '"gh pr merge *": "deny"' }
      - { id: gh-repo-delete-deny, contains: '"gh repo delete *": "deny"' }
      - { id: root-redirect-deny, contains: '"> /*": "deny"' }
      - { id: sudo-deny, contains: '"sudo *": "deny"' }
      - { id: rm-root-force-deny, contains: '"rm -rf /*": "deny"' }
      - { id: push-force-deny, contains: '"git push --force *": "deny"' }
      - { id: stash-push-allow, contains: '"git stash push *": "allow"' }
      - { id: stash-apply-allow, contains: '"git stash apply *": "allow"' }
      - { id: update-ref-deny, contains: '"git update-ref *": "deny"' }
      - { id: reflog-deny, contains: '"git reflog *": "deny"' }
      - { id: plans-mv-allow, contains: '"mv plans/*-*": "allow"' }

  - id: gitignore-config
    kind: config
    applicability: { always: true }
    install_strategy: merge
    sync_projection: assertions
    destination: .gitignore
    assertions:
      - { id: output-ignored, contains: 'output/' }
      - { id: pr-draft-ignored, contains: 'pr-draft.md' }
      - { id: commit-txt-ignored, contains: 'commit.txt' }
      - { id: completed-plans-ignored, contains: 'plans/.completed/' }
