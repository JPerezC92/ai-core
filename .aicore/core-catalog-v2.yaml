    install_strategy: copy
    sync_projection: file
    members:
      - { id: spec, source: .opencode/agents/atrium.md, destination: .opencode/agents/atrium.md }
      - { id: profile, source: agents/atrium/profile.md, destination: agents/atrium/profile.md }

