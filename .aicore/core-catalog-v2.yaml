  # ------------------------------------------------------ portable stories
  # Portable stories are delivered as `copy` file members split by
  # applicability class. The `user-stories` scaffold unit above stays
  # `preserve`; `user-stories/index.md` is NEVER a member — core index rows
  # are merged into the destination's existing table (see protocol-v2.md),
  # and `aicore-adoption-sync` is AICore-only, never a member.

  - id: portable-stories-always
    kind: user-story
    applicability: { always: true }
    install_strategy: copy
    sync_projection: file
    members:
      - { id: plan-enforce, source: user-stories/plan-enforce.md, destination: user-stories/plan-enforce.md, collision_policy: core_wins }
      - { id: git-pr-drafting, source: user-stories/git-pr-drafting.md, destination: user-stories/git-pr-drafting.md, collision_policy: core_wins }
      - { id: op-model-configuration, source: user-stories/op-model-configuration.md, destination: user-stories/op-model-configuration.md, collision_policy: core_wins }
      - { id: post-merge-branch-cleanup, source: user-stories/post-merge-branch-cleanup.md, destination: user-stories/post-merge-branch-cleanup.md, collision_policy: core_wins }

  - id: portable-stories-ticket
    kind: user-story
    applicability: { requires: [ticket_system] }
    install_strategy: copy
    sync_projection: file
    members:
      - { id: register-first-incident-identification, source: user-stories/register-first-incident-identification.md, destination: user-stories/register-first-incident-identification.md, collision_policy: core_wins }
      - { id: incident-query-verification-pilot, source: user-stories/incident-query-verification-pilot.md, destination: user-stories/incident-query-verification-pilot.md, collision_policy: core_wins }

  - id: portable-stories-python
    kind: user-story
    applicability: { requires: [python_scripts] }
    install_strategy: copy
    sync_projection: file
    members:
      - { id: python-pytest, source: user-stories/python-pytest.md, destination: user-stories/python-pytest.md, collision_policy: core_wins }

  # ---------------------------------------------------------------- config
  - id: root-runtime-spec
    kind: config
    applicability: { always: true }
    install_strategy: merge
    sync_projection: guarded_file
    destination_policy: adopter_root_rules
    rule_documents:
      - AGENTS.md
    members:
      - { id: root, source: AGENTS.md, destination: AGENTS.md }
    notes: >-
      Installer prepares a reviewed section-aware root result. It does not
      append roster lines into mandatory bytes. An adopter may map the logical
      `root` member to a differently named runtime spec (e.g. CLAUDE.md) via
      its declaration. `adopter_root_rules` is the two-section successor to
      `adopter_root_runtime`: an older engine that does not recognize it
      rejects the catalog instead of ignoring the protected-rule metadata.

  - id: opencode-config
    kind: config
    applicability: { always: true }
    install_strategy: merge
    sync_projection: assertions
    destination: opencode.jsonc
    assertions:
      - { id: gh-pr-merge-deny, contains: '"gh pr merge *": "deny"' }
      - { id: gh-repo-delete-deny, contains: '"gh repo delete *": "deny"' }
      - { id: root-redirect-deny, contains: '"> /*": "deny"' }
      - { id: sudo-deny, contains: '"sudo *": "deny"' }
      - { id: rm-root-force-deny, contains: '"rm -rf /*": "deny"' }
      - { id: push-force-deny, contains: '"git push --force *": "deny"' }
      - { id: stash-push-allow, contains: '"git stash push *": "allow"' }
      - { id: stash-apply-allow, contains: '"git stash apply *": "allow"' }
      - { id: update-ref-deny, contains: '"git update-ref *": "deny"' }
      - { id: reflog-deny, contains: '"git reflog *": "deny"' }
      - { id: plans-mv-allow, contains: '"mv plans/*-*": "allow"' }

  - id: gitignore-config
    kind: config
    applicability: { always: true }
    install_strategy: merge
    sync_projection: assertions
    destination: .gitignore
    assertions:
      - { id: output-ignored, contains: 'output/' }
      - { id: pr-draft-ignored, contains: 'pr-draft.md' }
      - { id: commit-txt-ignored, contains: 'commit.txt' }
      - { id: completed-plans-ignored, contains: 'plans/.completed/' }
