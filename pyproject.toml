[project]
name = "aicore"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["node_modules", ".venv", "output", "plans/.completed", "build", "dist", "__pycache__", ".git"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
